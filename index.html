<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webstie Test</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #333;
    }
    h1 {
      font-size: 3rem;
      color: #fff;
    }
    .nav-row {
      display: flex;
      flex-direction: row;
      gap: 2rem;
      margin-top: 2rem;
    }
    button {
      width: 8rem;
      height: 8rem;
      padding: 0;
      background: #888;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
    }
    button:hover {
      background: #aaa;
    }
    .icon {
      font-size: 3rem;
      line-height: 1;
    }
    .label {
      font-size: 0.8rem;
    }
    .ttt-icon {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      width: 2.6rem;
      height: 2.6rem;
      gap: 2px;
    }
    .ttt-icon div {
      background: #666;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      line-height: 1;
    }
    button:hover .ttt-icon div {
      background: #999;
    }
  </style>
</head>
<body>
  <h1>Hello Mr. Blake!</h1>
  <div class="nav-row">
    <button onclick="window.location.href='chess.html'">
      <span class="icon">&#9812;</span>
      <span class="label">Chess</span>
    </button>
    <button onclick="window.location.href='tictactoe.html'">
      <span class="ttt-icon">
        <div>X</div><div></div><div>O</div>
        <div></div><div>O</div><div></div>
        <div>X</div><div></div><div>X</div>
      </span>
      <span class="label">Tic Tac Toe</span>
    </button>
  </div>
</body>
</html>
