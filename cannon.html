<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webstie Test</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    .topbar {
      flex: 0 0 auto;
      height: 3.5rem;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      box-sizing: border-box;
      color: #fff;
    }
    .topbar .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 1rem;
      font-weight: bold;
    }
    button.home {
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      background: #888;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.home:hover {
      background: #aaa;
    }
    canvas {
      flex: 1 1 auto;
      display: block;
      background: #333;
      cursor: crosshair;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .overlay .panel {
      background: #444;
      padding: 2rem 3rem;
      border-radius: 12px;
      text-align: center;
      color: #fff;
    }
    .overlay h2 {
      margin-top: 0;
    }
    .overlay button {
      margin-top: 1rem;
      padding: 0.6rem 1.5rem;
      font-size: 1rem;
      background: #888;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .overlay button:hover {
      background: #aaa;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="home" onclick="window.location.href='index.html'">Go to Home Page</button>
    <div class="stats">
      <span id="timeStat">Time: 0.0s</span>
      <span id="shotsStat">Shots: 0</span>
      <span id="hitsStat">Hits: 0</span>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div class="overlay" id="overlay">
    <div class="panel">
      <h2>You win!</h2>
      <p id="finalTime"></p>
      <button id="restartBtn">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const timeStatEl = document.getElementById('timeStat');
    const shotsStatEl = document.getElementById('shotsStat');
    const hitsStatEl = document.getElementById('hitsStat');

    let width, height;
    function resize() {
      width = canvas.width = canvas.clientWidth;
      height = canvas.height = canvas.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const ROTATE_SPEED = 2.2;      // radians per second
    const BULLET_SPEED = 500;      // px per second
    const FLEE_SPEED = 160;        // px per second
    const SPAWN_INTERVAL = 5000;   // ms
    const MAX_DOTS = 20;
    const START_DOTS = 10;
    const WALL_MARGIN = 80;        // px from edge where dots start steering away
    const WALL_WEIGHT = 3.5;       // how strongly walls override the flee direction
    const CANNON_RADIUS = 10;
    const CANNON_FOLLOW_RATE = 4;  // higher = cannon catches up to the cursor faster

    const overlay = document.getElementById('overlay');
    const finalTimeEl = document.getElementById('finalTime');
    const restartBtn = document.getElementById('restartBtn');

    let cannonAngle = -Math.PI / 2;
    const keys = { ArrowLeft: false, ArrowRight: false };

    window.addEventListener('keydown', (e) => {
      if (e.key in keys) { keys[e.key] = true; e.preventDefault(); }
    });
    window.addEventListener('keyup', (e) => {
      if (e.key in keys) { keys[e.key] = false; e.preventDefault(); }
    });

    const cannon = { x: 0, y: 0 };
    const mouseTarget = { x: 0, y: 0 };
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseTarget.x = e.clientX - rect.left;
      mouseTarget.y = e.clientY - rect.top;
    });

    let bullets = [];
    let hits = 0;
    let shots = 0;

    canvas.addEventListener('mousedown', () => {
      if (gameOver) return;
      shots++;
      const tipX = cannon.x + Math.cos(cannonAngle) * 22;
      const tipY = cannon.y + Math.sin(cannonAngle) * 22;
      bullets.push({
        x: tipX,
        y: tipY,
        vx: Math.cos(cannonAngle) * BULLET_SPEED,
        vy: Math.sin(cannonAngle) * BULLET_SPEED,
      });
    });

    function randomDot() {
      return {
        x: Math.random() * width,
        y: Math.random() * height,
        vx: 0,
        vy: 0,
        radius: 9,
        wanderAngle: Math.random() * Math.PI * 2,
      };
    }

    let dots = [];
    let gameOver = false;
    let startTime = performance.now();
    let spawnTimer = null;

    function spawnDot() {
      if (!gameOver && dots.length < MAX_DOTS) dots.push(randomDot());
    }

    function resetGame() {
      cannon.x = width / 2;
      cannon.y = height / 2;
      mouseTarget.x = width / 2;
      mouseTarget.y = height / 2;
      dots = [];
      for (let i = 0; i < START_DOTS; i++) dots.push(randomDot());
      bullets = [];
      hits = 0;
      shots = 0;
      gameOver = false;
      startTime = performance.now();
      overlay.style.display = 'none';
      shotsStatEl.textContent = `Shots: ${shots}`;
      hitsStatEl.textContent = `Hits: ${hits}`;
      if (spawnTimer) clearInterval(spawnTimer);
      spawnTimer = setInterval(spawnDot, SPAWN_INTERVAL);
      lastTime = performance.now();
      requestAnimationFrame(tick);
    }

    restartBtn.addEventListener('click', resetGame);

    function drawCannon() {
      ctx.save();
      ctx.translate(cannon.x, cannon.y);
      ctx.rotate(cannonAngle);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, -4, 22, 8);
      ctx.restore();

      ctx.beginPath();
      ctx.fillStyle = '#ddd';
      ctx.arc(cannon.x, cannon.y, CANNON_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBullet(b) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(8, 0);
      ctx.lineTo(-6, -5);
      ctx.lineTo(-6, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawDot(d) {
      ctx.beginPath();
      ctx.fillStyle = '#4fd1c5';
      ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function resolveDotCollisions() {
      for (let i = 0; i < dots.length; i++) {
        for (let j = i + 1; j < dots.length; j++) {
          const a = dots[i], b = dots[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const minDist = a.radius + b.radius;
          if (dist < minDist) {
            const nx = dist > 0.001 ? dx / dist : 1;
            const ny = dist > 0.001 ? dy / dist : 0;
            const overlap = (minDist - dist) / 2;
            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;
          }
        }
      }
      for (const d of dots) {
        d.x = Math.max(d.radius, Math.min(width - d.radius, d.x));
        d.y = Math.max(d.radius, Math.min(height - d.radius, d.y));
      }
    }

    let lastTime = performance.now();
    function tick(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (keys.ArrowLeft) cannonAngle -= ROTATE_SPEED * dt;
      if (keys.ArrowRight) cannonAngle += ROTATE_SPEED * dt;

      const followFactor = 1 - Math.exp(-CANNON_FOLLOW_RATE * dt);
      cannon.x += (mouseTarget.x - cannon.x) * followFactor;
      cannon.y += (mouseTarget.y - cannon.y) * followFactor;

      for (const d of dots) {
        const dx = d.x - cannon.x;
        const dy = d.y - cannon.y;
        const dist = Math.hypot(dx, dy);
        const nx = dist > 0.01 ? dx / dist : Math.cos(d.wanderAngle);
        const ny = dist > 0.01 ? dy / dist : Math.sin(d.wanderAngle);

        let wx = 0, wy = 0;
        if (d.x < WALL_MARGIN) wx += (WALL_MARGIN - d.x) / WALL_MARGIN;
        if (d.x > width - WALL_MARGIN) wx -= (WALL_MARGIN - (width - d.x)) / WALL_MARGIN;
        if (d.y < WALL_MARGIN) wy += (WALL_MARGIN - d.y) / WALL_MARGIN;
        if (d.y > height - WALL_MARGIN) wy -= (WALL_MARGIN - (height - d.y)) / WALL_MARGIN;

        let combinedX = nx + wx * WALL_WEIGHT;
        let combinedY = ny + wy * WALL_WEIGHT;
        const combinedDist = Math.hypot(combinedX, combinedY);
        if (combinedDist > 0.01) {
          combinedX /= combinedDist;
          combinedY /= combinedDist;
        } else {
          combinedX = Math.cos(d.wanderAngle);
          combinedY = Math.sin(d.wanderAngle);
        }

        d.vx += (combinedX * FLEE_SPEED - d.vx) * 0.08;
        d.vy += (combinedY * FLEE_SPEED - d.vy) * 0.08;
        d.x += d.vx * dt;
        d.y += d.vy * dt;

        d.x = Math.max(d.radius, Math.min(width - d.radius, d.x));
        d.y = Math.max(d.radius, Math.min(height - d.radius, d.y));
      }

      resolveDotCollisions();
      resolveDotCollisions();

      for (const b of bullets) {
        b.x += b.vx * dt;
        b.y += b.vy * dt;
      }
      bullets = bullets.filter(b => b.x > -20 && b.x < width + 20 && b.y > -20 && b.y < height + 20);

      for (const b of bullets) {
        for (const d of dots) {
          if (!d.hit && Math.hypot(b.x - d.x, b.y - d.y) < d.radius + 6) {
            b.hit = true;
            d.hit = true;
            hits++;
          }
        }
      }

      for (const d of dots) {
        if (!d.hit && Math.hypot(cannon.x - d.x, cannon.y - d.y) < CANNON_RADIUS + d.radius) {
          d.hit = true;
          hits++;
        }
      }

      bullets = bullets.filter(b => !b.hit);
      dots = dots.filter(d => !d.hit);
      shotsStatEl.textContent = `Shots: ${shots}`;
      hitsStatEl.textContent = `Hits: ${hits}`;
      timeStatEl.textContent = `Time: ${((now - startTime) / 1000).toFixed(1)}s`;

      ctx.clearRect(0, 0, width, height);
      for (const d of dots) drawDot(d);
      for (const b of bullets) drawBullet(b);
      drawCannon();

      if (dots.length === 0 && !gameOver) {
        gameOver = true;
        clearInterval(spawnTimer);
        const elapsed = (now - startTime) / 1000;
        finalTimeEl.textContent = `You cleared the board in ${elapsed.toFixed(2)}s`;
        overlay.style.display = 'flex';
      }

      if (!gameOver) requestAnimationFrame(tick);
    }
    resetGame();
  </script>
</body>
</html>
